<!doctype html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Redefinir senha — Corretix</title></head>
<!-- Variáveis: {{ .ConfirmationURL }} = link para criar a nova senha -->
<body style="margin:0;padding:0;background:#ffffff;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#ffffff;">
  <tr><td align="center" style="padding:32px 16px;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;font-family:Arial,Helvetica,sans-serif;color:#102034;">
      <tr><td style="padding:0 0 24px 0;"><img src="https://corretix.com.br/email/logo-corretix.png" width="200" height="48" alt="Corretix" style="display:block;border:0;"></td></tr>
      <tr><td style="border:1px solid #d5e2eb;border-radius:14px;padding:32px;">
        <h1 style="margin:0 0 12px 0;font-size:22px;">Vamos criar uma nova senha</h1>
        <p style="margin:0 0 24px 0;font-size:16px;line-height:1.6;">Recebemos um pedido para redefinir a senha da sua conta no Corretix. Clique no botão abaixo para escolher a nova senha.</p>
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin:0 0 24px 0;"><tr><td style="border-radius:10px;background:#006eb8;">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:15px 30px;font-size:16px;font-weight:bold;color:#ffffff;text-decoration:none;border-radius:10px;">Criar nova senha</a>
        </td></tr></table>
        <p style="margin:0;font-size:13px;line-height:1.6;color:#5c6b7a;">Se você não pediu isso, ignore este e-mail: sua senha atual continua valendo.</p>
      </td></tr>
      <tr><td style="padding:24px 8px 0 8px;font-size:12px;color:#5c6b7a;text-align:center;">
        Dúvidas: <a href="mailto:contato@corretix.com.br" style="color:#007db7;">contato@corretix.com.br</a> · <a href="https://corretix.com.br" style="color:#007db7;">corretix.com.br</a>
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
