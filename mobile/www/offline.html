<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vigentt — sem conexão</title>
<style>
  html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#1bb3f0,#0a86d0 55%,#0c3f86);color:#fff;text-align:center;padding:24px;box-sizing:border-box}
  .box{max-width:320px}
  h1{font-size:22px;margin:24px 0 8px}
  p{opacity:.9;line-height:1.45;margin:0 0 28px}
  button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 28px;background:#fff;color:#0a4d94}
</style>
</head>
<body>
  <div class="box">
    <svg width="88" height="88" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#fff" fill-opacity=".15"/><path d="M32 8.5 50.5 15v14.8c0 12.2-7.6 20.9-18.5 25.7C21.1 50.7 13.5 42 13.5 29.8V15Z" fill="#fff"/><path d="M41.5 31a9.5 9.5 0 1 1-4.75-8.23" fill="none" stroke="#0a86d0" stroke-width="3.6" stroke-linecap="round"/><path d="M40.9 25.2 35 25.9l3.9-6.3Z" fill="#0a86d0"/><path d="m27.8 31.4 3.1 3.1 5.4-6.2" fill="none" stroke="#0c3f86" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <h1>Sem conexão</h1>
    <p>O Vigentt precisa de internet para mostrar a carteira atualizada. Verifique o Wi-Fi ou os dados móveis.</p>
    <button onclick="history.length > 1 ? history.back() : location.reload()">Tentar de novo</button>
  </div>
</body>
</html>
